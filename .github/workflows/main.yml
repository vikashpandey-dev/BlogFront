
name: Deploy React Blog to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Configure SSH
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload Build
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_key" \
            dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/blog-dist/

      - name: Deploy and Restart PM2
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            sudo mkdir -p /var/www/BlogFront/dist

            sudo rsync -av --delete \
              /home/ubuntu/blog-dist/ \
              /var/www/BlogFront/dist/

            sudo chown -R ubuntu:www-data /var/www/BlogFront/dist

            sudo find /var/www/BlogFront/dist -type d -exec chmod 755 {} \;
            sudo find /var/www/BlogFront/dist -type f -exec chmod 644 {} \;

            if pm2 describe blog-front >/dev/null 2>&1; then
              pm2 restart blog-front
            else
              pm2 serve /var/www/BlogFront/dist 4173 --spa --name blog-front
            fi

            pm2 save

            sudo nginx -t
            sudo systemctl reload nginx

            EOF
